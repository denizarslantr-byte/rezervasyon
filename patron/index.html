<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Piano Deri — Patron Paneli</title>
<link rel="stylesheet" href="../assets/piano-theme.css">
<style>
/* ── Patron'a özgü stiller ── */
.patron-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.patron-stat{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.patron-stat .ps-val{font-size:24px;font-weight:900;color:var(--gold2);line-height:1}
.patron-stat .ps-lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-top:5px}
.patron-stat.ps-satis .ps-val{color:#60a5fa}
.patron-stat.ps-bos   .ps-val{color:#f87171}
.patron-stat.ps-done  .ps-val{color:#bbf7d0}

/* Saat grubu başlığı */
.p-time-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:8px;margin:10px 0 4px;font-weight:700;color:var(--gold2)}
.p-time-head .ptc{font-size:11px;color:var(--text2);font-weight:400;margin-left:4px}

/* Read-only tablo — kompakt satırlar */
.ro-table{width:100%;border-collapse:collapse;font-size:12px}
.ro-table th{background:var(--bg2);color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:7px 6px;text-align:left;white-space:nowrap}
.ro-table td{padding:6px 6px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.ro-table tr.row-done td{color:#6ee7a0}
.ro-table tr.row-inside td{color:#fde68a}
.ro-table tr.row-cancel td{color:#6b7280;text-decoration:line-through;opacity:.6}

/* Otel filtre çipleri */
.p-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.p-chip{border:1px solid var(--border);border-radius:999px;background:var(--bg3);color:var(--text2);padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
.p-chip.active{background:rgba(160,120,48,.2);border-color:var(--gold);color:var(--gold2)}

/* Üst çubuk tarih/otel */
.p-topbar{padding:9px 14px;margin-bottom:8px}
.p-topbar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Rapor tab */
.p-rapor-card{background:var(--bg3);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.p-rapor-head{background:var(--bg2);padding:12px 16px;display:flex;align-items:center;gap:8px}
.p-rapor-head .prh-name{font-weight:700;font-size:13px;color:var(--gold2);flex:1}
.p-rapor-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.p-rstat{background:var(--bg2);border-radius:8px;text-align:center;padding:10px 4px}
.p-rstat b{display:block;font-size:20px;font-weight:900;color:var(--gold2)}
.p-rstat span{font-size:10px;color:var(--text2);text-transform:uppercase}
.p-rstat.rss b{color:#60a5fa}.p-rstat.rsb b{color:#f87171}

input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.8) brightness(1.5) sepia(0.3) saturate(2) hue-rotate(10deg);cursor:pointer;opacity:.85}
</style>
</head>
<body>
<div class="app">
  <div class="app-brand">
    <div class="p">P</div>
    <div class="name">PIANO DERİ</div>
    <div class="sub">PATRON PANELİ</div>
  </div>

  <div class="panel-card p-topbar">
    <div class="p-topbar-row">
      <label style="margin:0;font-weight:700;font-size:12px;text-transform:uppercase">TARİH</label>
      <input type="date" id="patronDate" style="width:140px">
      <span id="patronDateDisplay" style="font-size:13px;color:var(--gold2);font-weight:700"></span>
      <button class="btn-dark btn-sm" onclick="loadAll()" style="padding:6px 9px;font-size:14px" title="Yenile">↺</button>
      <button class="btn-gold btn-sm" onclick="loadAll()">Göster</button>
    </div>
  </div>

  <div class="center-layout">
    <!-- Sol Menü -->
    <aside class="side-menu panel-card">
      <button id="mnHome"   class="btn-dark active-menu" onclick="showSection('homeSection','mnHome')">🏠 Günlük Liste</button>
      <button id="mnRapor"  class="btn-dark" onclick="showSection('raporSection','mnRapor')">📊 Rapor</button>
    </aside>

    <main style="min-width:0;overflow:hidden">

      <!-- GÜNLÜK LİSTE -->
      <section id="homeSection" class="section active">
        <!-- Özet kartlar -->
        <div class="patron-summary" id="patronSummary"></div>
        <!-- Otel filtre -->
        <div class="p-chips" id="patronChips"></div>
        <!-- Rezervasyon listesi -->
        <div id="patronList"></div>
      </section>

      <!-- RAPOR -->
      <section id="raporSection" class="section">
        <div class="panel-card">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">
            <h2 style="margin:0;color:var(--gold2);flex:1">📊 Rapor</h2>
            <button class="btn-dark btn-sm" onclick="setRange('today')">Bugün</button>
            <button class="btn-dark btn-sm" onclick="setRange('week')">Bu Hafta</button>
            <button class="btn-dark btn-sm" onclick="setRange('month')">Bu Ay</button>
            <input type="date" id="rStart" style="width:130px">
            <span style="color:var(--text2)">—</span>
            <input type="date" id="rEnd" style="width:130px">
            <button class="btn-gold btn-sm" onclick="loadReport()">Göster</button>
          </div>
          <div id="patronReport"></div>
        </div>
      </section>

    </main>

    <!-- Sağ panel -->
    <aside style="min-width:0">
      <div class="panel-card">
        <div style="font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px">Günlük Özet · <span id="patronSumDate" style="color:var(--gold)"></span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
          <div style="text-align:center"><div id="psTotal" style="font-size:20px;font-weight:900;color:var(--gold2)">—</div><div style="font-size:9px;color:var(--text2)">REZERVASYON</div></div>
          <div style="text-align:center"><div id="psPax"   style="font-size:20px;font-weight:900;color:var(--gold2)">—</div><div style="font-size:9px;color:var(--text2)">PAX</div></div>
          <div style="text-align:center"><div id="psIn"    style="font-size:20px;font-weight:900;color:#fde68a">—</div><div style="font-size:9px;color:var(--text2)">İÇERİDE</div></div>
          <div style="text-align:center"><div id="psDone"  style="font-size:20px;font-weight:900;color:#bbf7d0">—</div><div style="font-size:9px;color:var(--text2)">TAMAMLANDI</div></div>
          <div style="text-align:center"><div id="psSatis" style="font-size:20px;font-weight:900;color:#60a5fa">—</div><div style="font-size:9px;color:var(--text2)">SATIŞ</div></div>
          <div style="text-align:center"><div id="psBos"   style="font-size:20px;font-weight:900;color:#f87171">—</div><div style="font-size:9px;color:var(--text2)">BOŞ ✦</div></div>
        </div>
        <div style="font-size:9px;color:var(--text2);margin-top:6px;opacity:.6">✦ Satış olmadan tamamlanan</div>
      </div>
    </aside>
  </div>
</div>

<script src="../config/config.js?v=20260516-patron-v10"></script>
<script src="../config/firebase.js?v=20260516-patron-v10"></script>
<script src="../assets/common.js?v=20260516-patron-v10"></script>
<script src="../assets/firebase-api.js?v=20260516-patron-v10"></script>
<script>
let allRes = [], allHotels = [];
let selHotel = "";

const pax  = r => (Number(r.adult)||0)+(Number(r.child)||0);
const isSale = r => String(r.satis||"").toUpperCase()==="TRUE";
const isDone = r => String(r.cikti||"").toUpperCase()==="TRUE";
const isInside = r => String(r.girdi||"").toUpperCase()==="TRUE" && !isDone(r);
const isWait = r => !isInside(r) && !isDone(r) && r.status!=="CANCELLED";
const isBos = r => isDone(r) && !isSale(r);

function rowCls(r) {
  if (r.status==="CANCELLED") return "row-cancel";
  if (isDone(r)) return "row-done";
  if (isInside(r)) return "row-inside";
  return "";
}
function statusTxt(r) {
  if (r.status==="CANCELLED") return "İPTAL";
  if (isDone(r)) return "ÇIKTI";
  if (isInside(r)) return "İÇERİDE";
  return "BEKLİYOR";
}

function showSection(id, btn) {
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".side-menu button").forEach(b=>b.classList.remove("active-menu"));
  if (btn) document.getElementById(btn).classList.add("active-menu");
}

function counts(list) {
  return {
    total: list.length,
    pax:   list.reduce((s,r)=>s+pax(r),0),
    wait:  list.filter(isWait).length,
    inside:list.filter(isInside).length,
    done:  list.filter(isDone).length,
    satis: list.filter(isSale).length,
    bos:   list.filter(isBos).length
  };
}

function renderSummary() {
  const vis = selHotel ? allRes.filter(r=>r.hotel===selHotel) : allRes;
  const c = counts(vis);
  const items = [
    {k:"total", lbl:"Toplam", cls:"", val:c.total},
    {k:"wait",  lbl:"Bekleyen", cls:"", val:c.wait},
    {k:"inside",lbl:"İçeride", cls:"", val:c.inside},
    {k:"done",  lbl:"Tamamlandı", cls:"ps-done", val:c.done},
    {k:"satis", lbl:"Satış ✦", cls:"ps-satis", val:c.satis},
    {k:"bos",   lbl:"Boş ✦", cls:"ps-bos", val:c.bos},
  ];
  patronSummary.innerHTML = items.map(it=>`
    <div class="patron-stat ${it.cls}">
      <div class="ps-val">${it.val}</div>
      <div class="ps-lbl">${it.lbl}</div>
    </div>`).join("");
  // Sağ panel özet
  psTotal.innerText=c.total; psPax.innerText=c.pax; psIn.innerText=c.inside;
  psDone.innerText=c.done; psSatis.innerText=c.satis; psBos.innerText=c.bos;
  patronSumDate.innerText = fmtDate(patronDate.value);
}

function renderChips() {
  const hotelNames = [...new Set(allRes.map(r=>r.hotel).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));
  patronChips.innerHTML = `<button class="p-chip ${!selHotel?"active":""}" onclick="setHotel('')">Tüm Oteller</button>`
    + hotelNames.map(h=>`<button class="p-chip ${selHotel===h?"active":""}" onclick="setHotel('${h.replace(/'/g,"&#39;")}')">${h}</button>`).join("");
}

function setHotel(h) { selHotel=h; renderAll(); }

function renderList() {
  const list = selHotel ? allRes.filter(r=>r.hotel===selHotel) : allRes;
  if (!list.length) {
    patronList.innerHTML = `<div class="panel-card" style="text-align:center;color:var(--text2);padding:24px">${fmtDate(patronDate.value)} tarihinde rezervasyon yok.</div>`;
    return;
  }
  const grouped = {};
  list.forEach(r => { if(!grouped[r.time]) grouped[r.time]=[]; grouped[r.time].push(r); });
  const keys = Object.keys(grouped).sort();

  patronList.innerHTML = keys.map(t => `
    <div class="p-time-head">⏰ ${t}<span class="ptc">${grouped[t].length} rezervasyon</span></div>
    <div class="panel-card table-wrap" style="padding:0;margin-bottom:10px">
      <table class="ro-table">
        <thead><tr>
          <th>Otel</th><th>Yet.</th><th>Çoc.</th><th>Uyruk</th><th>Kart</th><th>Plaka</th>
          <th>Personel</th><th>Durum</th><th>Satış</th><th>Not</th>
        </tr></thead>
        <tbody>
          ${grouped[t].map(r=>`
            <tr class="${rowCls(r)}">
              <td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.hotel}</td>
              <td>${r.adult}</td>
              <td>${r.child}</td>
              <td>${r.nation||""}</td>
              <td>${r.kart||""}</td>
              <td style="font-size:11px">${r.ayak||""}</td>
              <td style="font-size:11px">${[r.staff1,r.staff2,r.staff3,r.staff4].filter(Boolean).join(", ")}</td>
              <td><span class="badge ${r.status==="CANCELLED"?"cancelled":isDone(r)?"exited":isInside(r)?"entered":"pending"}">${statusTxt(r)}</span></td>
              <td>${isSale(r)?'<span style="color:#60a5fa;font-weight:700">SATIŞ</span>':'<span style="color:#f87171">Boş</span>'}</td>
              <td style="font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis">${r.notes||""}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`).join("");
}

function renderAll() { renderSummary(); renderChips(); renderList(); }

async function loadAll() {
  patronDateDisplay.innerText = fmtDate(patronDate.value);
  patronList.innerHTML = '<div class="panel-card" style="text-align:center;color:var(--text2);padding:20px">Yükleniyor...</div>';
  allRes = (await getReservations(patronDate.value)) || [];
  renderAll();
}

// ── Rapor ──
function setRange(r) {
  const t=todayStr();
  if(r==="today"){rStart.value=t;rEnd.value=t;}
  else if(r==="week"){rStart.value=weekStart(t);rEnd.value=t;}
  else if(r==="month"){rStart.value=monthStart(t);rEnd.value=t;}
  loadReport();
}

async function loadReport() {
  patronReport.innerHTML='<div style="color:var(--text2);text-align:center;padding:18px">Yükleniyor...</div>';
  const s=rStart.value, e=rEnd.value;
  let all=(await getReservations()).filter(r=>r.status!=="CANCELLED"&&(!s||r.date>=s)&&(!e||r.date<=e));
  const groups={};
  all.forEach(r=>(groups[r.hotel||"İsimsiz"]??=[]).push(r));
  patronReport.innerHTML = Object.keys(groups).sort((a,b)=>a.localeCompare(b,"tr")).map(hotel=>{
    const l=groups[hotel];
    const c=counts(l);
    return `<div class="p-rapor-card">
      <div class="p-rapor-head"><span class="prh-name">▣ ${hotel}</span></div>
      <div class="p-rapor-stats">
        <div class="p-rstat"><b>${c.total}</b><span>T.Rez</span></div>
        <div class="p-rstat"><b>${c.pax}</b><span>T.Pax</span></div>
        <div class="p-rstat rss"><b>${c.satis}</b><span>Satış</span></div>
        <div class="p-rstat rsb"><b>${c.bos}</b><span>Boş</span></div>
      </div>
    </div>`;
  }).join("") || '<div style="color:var(--text2);text-align:center;padding:20px">Kayıt yok.</div>';
}

// Bootstrap
patronDate.value = todayStr();
patronDateDisplay.innerText = fmtDate(todayStr());
rStart.value = todayStr(); rEnd.value = todayStr();
loadAll();
setInterval(loadAll, 15000);
</script>
</body>
</html>
