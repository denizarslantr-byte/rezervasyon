<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Piano Deri Merkez V5.8</title><link rel="stylesheet" href="../assets/piano-theme.css"></head><body><div class="app"><div class="app-brand"><div class="p">P</div><div class="name">PIANO DERİ</div><div class="sub">MERKEZ OPERASYON EKRANI</div></div><div id="apiWarning" class="notice" style="display:none"></div><div class="center-layout"><aside class="side-menu panel-card"><button class="btn-gold" onclick="showSection('homeSection')">Ana Ekran</button><button class="btn-dark" onclick="showSection('manualSection')">Elle Rezervasyon</button><button class="btn-dark" onclick="showSection('staffSection')">Personel</button><button class="btn-dark" onclick="showSection('offSection')">İzinli Girişi</button><button class="btn-dark" onclick="location.href='../admin/admin.html'">Admin</button><button class="btn-dark" onclick="location.href='../hotel/login.html'">Otel Giriş</button></aside><main><section id="homeSection" class="section active"><div class="panel-card"><label>Tarih Seç</label><input type="date" id="datePicker" onchange="loadAll()"></div><div id="reservationList"></div></section><section id="manualSection" class="section"><div class="panel-card"><h2>Elle Rezervasyon</h2><div class="grid grid4"><input id="centerHotel" placeholder="Otel"><input type="date" id="centerDate"><input type="time" id="centerTime"><select id="centerNation"><option>Russian</option><option>German</option><option>English</option><option>Turkish</option><option>Other</option></select></div><br><div class="grid grid4"><input type="number" id="centerAdult" value="2"><input type="number" id="centerChild" value="0"><input id="centerKart" placeholder="KART"><input id="centerAyak" placeholder="AYAK"></div><br><textarea id="centerNotes" placeholder="Not"></textarea><br><br><button class="btn-gold" onclick="saveCenterReservation()">KAYDET</button></div></section><section id="staffSection" class="section"><div class="panel-card"><h2>Personel Yönetimi</h2><div class="grid grid2"><input id="staffName" placeholder="Personel adı"><button class="btn-gold" onclick="addStaff()">Personel Ekle</button></div><br><div id="allStaffList"></div></div></section><section id="offSection" class="section"><div class="panel-card"><h2>İzinli Personel Girişi</h2><label>İzin Tarihi</label><input type="date" id="offDate" onchange="renderStaff()"><br><br><label>Personel</label><select id="offStaffSelect"></select><br><br><button class="btn-gold" onclick="makeOff(true)">İzinli Yap</button><button class="btn-dark" onclick="makeOff(false)">İzni Kaldır</button></div></section></main><aside><div class="panel-card"><h2>Personel Durumu</h2><p>Seçilen tarih: <b id="selectedDateLabel"></b></p><h3>Boşta Olanlar</h3><div id="freeStaffList" class="staff-list"></div><h3>İzinli Olanlar</h3><div id="offStaffList" class="staff-list"></div><h3>Tüm Personel</h3><div id="allStaffMini"></div></div></aside></div></div><script src="../config/config.js"></script><script src="../assets/common.js"></script><script>
showApiWarning();let reservations=[],staff=[];const today=new Date().toISOString().slice(0,10);datePicker.value=today;centerDate.value=today;offDate.value=today;centerTime.value="10:30";function showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
async function loadAll(){reservations=await apiGet("getReservations",{date:datePicker.value});staff=await apiGet("getStaff");selectedDateLabel.innerText=datePicker.value;renderReservations();renderStaff()}
function isOff(s,d=datePicker.value){return String(s.offDates||"").split(",").map(x=>x.trim()).filter(Boolean).includes(d)}
function usedStaff(){let u=new Set();reservations.forEach(r=>{if(String(r.girdi).toUpperCase()==="TRUE"&&String(r.cikti).toUpperCase()!=="TRUE"){[r.staff1,r.staff2,r.staff3,r.staff4].filter(Boolean).forEach(x=>u.add(x))}});return u}
function freeStaff(){let u=usedStaff();return staff.filter(s=>s.status==="ACTIVE"&&!isOff(s)&&!u.has(s.name))}
function renderStaff(){let free=freeStaff(),off=staff.filter(s=>isOff(s));freeStaffList.innerHTML=free.length?free.map(s=>`<span class="staff-pill staff-free">${s.name}</span>`).join(""):"Boşta personel yok.";offStaffList.innerHTML=off.length?off.map(s=>`<span class="staff-pill staff-off">${s.name}</span>`).join(""):"İzinli personel yok.";allStaffMini.innerHTML=staff.length?staff.map(s=>`<div>${s.name}</div>`).join(""):"Personel yok.";allStaffList.innerHTML=staff.length?staff.map(s=>`<div class="res-card"><b>${s.name}</b> <button class="btn-red" onclick="deleteStaff('${s.id}')">Sil</button></div>`).join(""):"Personel yok.";offStaffSelect.innerHTML=staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}
async function addStaff(){if(!staffName.value.trim())return alert("Personel adı yazın");let r=await apiPost("addStaff",{name:staffName.value.trim()});if(r.success){staffName.value="";loadAll()}else alert(r.message||"Personel eklenemedi")}
async function deleteStaff(id){if(confirm("Personel silinsin mi?")){await apiGet("deleteStaff",{id});loadAll()}}
async function makeOff(off){if(!offStaffSelect.value)return alert("Personel seçin");await apiPost("setStaffOff",{id:offStaffSelect.value,date:offDate.value,off});datePicker.value=offDate.value;loadAll()}
function badge(r){if(r.status==="CANCELLED")return'<span class="badge cancelled">İPTAL</span>';if(String(r.girdi).toUpperCase()==="TRUE")return'<span class="badge entered">GİRDİ</span>';if(String(r.cikti).toUpperCase()==="TRUE")return'<span class="badge exited">ÇIKTI</span>';return`<span class="badge pending">${r.status||"PENDING"}</span>`}
function renderReservations(){let g={};reservations.forEach(r=>{if(!g[r.time])g[r.time]=[];g[r.time].push(r)});reservationList.innerHTML=Object.keys(g).length?Object.keys(g).sort().map(t=>`<div class="time-title">${t}</div><div class="panel-card table-wrap"><table><thead><tr><th>Girdi</th><th>Çıktı</th><th>ID</th><th>DATE</th><th>TIME</th><th>HOTEL</th><th>ADULT</th><th>CHILD</th><th>NATION</th><th>NOTES</th><th>STATUS</th><th>KART</th><th>AYAK</th><th>İşlem</th></tr></thead><tbody>${g[t].map(r=>`<tr><td><input type="checkbox" ${String(r.girdi).toUpperCase()==="TRUE"?"checked":""} onchange="updateGirdi('${r.id}',this.checked)"></td><td><input type="checkbox" ${String(r.cikti).toUpperCase()==="TRUE"?"checked":""} onchange="updateCikti('${r.id}',this.checked)"></td><td>${r.id}</td><td>${r.date}</td><td>${r.time}</td><td>${r.hotel}</td><td>${r.adult}</td><td>${r.child}</td><td>${r.nation}</td><td>${r.notes||""}</td><td>${badge(r)}</td><td><input class="compact-input" id="kart_${r.id}" value="${r.kart||""}"></td><td><input class="compact-input" id="ayak_${r.id}" value="${r.ayak||""}"></td><td class="action-cell"><button class="btn-dark" onclick="saveKartAyak('${r.id}')">Kaydet</button> <button class="btn-blue" onclick='editCenter(${JSON.stringify(r)})'>Düzelt</button></td></tr>`).join("")}</tbody></table></div>`).join(""):`<div class="panel-card">Seçilen tarihte rezervasyon yok.</div>`}
async function saveCenterReservation(){await apiPost("addReservation",{date:centerDate.value,time:centerTime.value,hotel:centerHotel.value,adult:centerAdult.value,child:centerChild.value,nation:centerNation.value,notes:centerNotes.value,kart:centerKart.value,ayak:centerAyak.value,status:"PENDING"});datePicker.value=centerDate.value;showSection("homeSection");loadAll()}
function editCenter(r){showSection("manualSection");centerHotel.value=r.hotel;centerDate.value=r.date;centerTime.value=r.time;centerAdult.value=r.adult;centerChild.value=r.child;centerNation.value=r.nation;centerNotes.value=r.notes;centerKart.value=r.kart;centerAyak.value=r.ayak;alert("Düzeltme için form açıldı. Değiştirip KAYDET basarsanız yeni kayıt oluşur. Eski kaydı iptal etmek için otel/merkez listeden iptal edebilirsiniz.")}
async function updateGirdi(id,checked){await apiPost("updateReservationOps",{id,girdi:checked?"TRUE":"",status:checked?"IN_STORE":"PENDING"});loadAll()}
async function updateCikti(id,checked){await apiPost("updateReservationOps",{id,cikti:checked?"TRUE":"",status:checked?"EXITED":"IN_STORE"});loadAll()}
async function saveKartAyak(id){await apiPost("updateReservationOps",{id,kart:document.getElementById("kart_"+id).value,ayak:document.getElementById("ayak_"+id).value});loadAll()}
loadAll();setInterval(loadAll,15000);
</script></body></html>
